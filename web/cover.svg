<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="GemmaForge cover">
  <defs>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="50%" stop-color="#f4d03f"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1218"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd6df"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .wordmark { font-weight: 600; letter-spacing: -2px; }
      .tagline { font-weight: 400; letter-spacing: -0.2px; }
      .label { font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
      .footer { font-weight: 400; letter-spacing: 0.2px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <g opacity="0.06" stroke="#7a8694" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <g transform="translate(96, 150)">
    <text class="sans label" x="0" y="0" fill="#6b7785" font-size="14">Gemma 4 Good Hackathon</text>

    <text class="sans wordmark" x="0" y="120" fill="url(#wordmark)" font-size="124">GemmaForge</text>

    <text class="sans tagline" x="0" y="200" fill="#aab3bf" font-size="30">Real-time vulnerability detection inside Gemma 4</text>
  </g>

  <g transform="translate(96, 430)">
    <text class="sans label" x="0" y="0" fill="#6b7785" font-size="12">Probe risk</text>
    <rect x="0" y="14" width="1008" height="10" rx="5" fill="#11161d"/>
    <rect x="0" y="14" width="1008" height="10" rx="5" fill="url(#risk)"/>
    <g class="mono" fill="#6b7785" font-size="11">
      <text x="0" y="48">safe</text>
      <text x="500" y="48" text-anchor="middle">suspicious</text>
      <text x="1008" y="48" text-anchor="end">vulnerable</text>
    </g>
  </g>

  <g transform="translate(96, 560)">
    <text class="sans footer" x="0" y="0" fill="#5b6470" font-size="14">Doruk Tan Ozturk  ·  Mehmet Efe Akça  ·  Apache-2.0</text>
  </g>
</svg>
